server:
  port: 13343
  host: "127.0.0.1"
  sse_keepalive_seconds: 15

agent:
  python_url: "http://127.0.0.1:9100"

mcp:
  webhunter:
    url: "http://127.0.0.1:9124/message"
    token: "dhunter-mcp-please-change-me"

llm:
  provider: anthropic
  model: claude-sonnet-4-5
  base_url: "https://api.minimaxi.com/anthropic"
  api_key: ""
  max_tokens: 32768

storage:
  # Relative to this file's directory (configs/), so it resolves to
  # <project-root>/data/dhunter.db on any OS. Override with DHUNTER_SQLITE_PATH.
  sqlite_path: "../data/dhunter.db"

admin:
  username: "admin"
  # 首次启动的初始密码（会持久化，之后可在设置页修改）。留空则随机生成并在横幅展示。
  bootstrap_password: ""
  token: "dhunter-admin-please-change-me"
