name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Go build + vet + test
        run: |
          go build ./...
          go vet ./...
          go test ./...

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Python tests
        run: |
          pip install -r agents/requirements.txt pytest
          cd agents && pytest tests/ -q

      - name: Frontend test + build
        run: |
          cd frontend && npm ci && npm test && npm run build
